<!DOCTYPE html>
<html>
<head>
<title>Facebook Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f0f2f5;
}

.container{
    width:350px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
}

.logo{
    font-size:40px;
    color:#1877f2;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#166fe5;
}

.link{
    margin-top:10px;
    display:block;
    color:#1877f2;
    text-decoration:none;
}

.signup{
    margin-top:20px;
    padding:10px;
    background:#42b72a;
    color:white;
    border-radius:6px;
    display:inline-block;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">facebook</div>

<input type="text" placeholder="Email or Phone Number">

<input type="password" placeholder="Password">

<button>Log In</button>

<a class="link" href="#">Forgotten password?</a>

<hr>

<a class="signup" href="#">Create New Account</a>

</div>

</body>
</html>
